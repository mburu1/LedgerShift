bundle:
  name: ledgershift

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this deployment
    default: ledgershift_dev
  service_principal_id:
    description: Application ID of the production run-as service principal
    default: "00000000-0000-0000-0000-000000000000"
  warehouse_id:
    description: Existing SQL warehouse ID for SQL tasks
    default: ""
  source_path:
    description: Workspace-visible source snapshot path for validation job
    default: /Volumes/ledgershift_dev/bronze/source/orders.jsonl
  target_path:
    description: Workspace-visible Delta path for validation job
    default: /Volumes/ledgershift_dev/gold/mart_daily_revenue

workspace:
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: ledgershift_dev
    workspace:
      host: ${env.DATABRICKS_HOST}
  prod:
    mode: production
    variables:
      catalog: ledgershift_prod
    workspace:
      host: ${env.DATABRICKS_HOST}
    run_as:
      service_principal_name: ${var.service_principal_id}
