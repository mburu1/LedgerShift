resources:
  jobs:
    ledgershift_pipeline:
      name: ledgershift-${bundle.target}-pipeline
      description: "LedgerShift medallion pipeline; deployable bundle entry point."
      max_concurrent_runs: 1
      tasks:
        - task_key: pipeline_entrypoint
          description: "Runs the packaged LedgerShift pipeline entrypoint."
          spark_python_task:
            python_file: ../src/ledgershift/pipelines/local.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml
    ledgershift_validation:
      name: ledgershift-${bundle.target}-validation
      description: "Reconciliation gate; configure source and target adapters before production use."
      max_concurrent_runs: 1
      tasks:
        - task_key: validation_entrypoint
          spark_python_task:
            python_file: ../src/ledgershift/validation/runner.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml
