resources:
  jobs:
    ledgershift_pipeline:
      name: ledgershift-${bundle.target}-pipeline
      description: "LedgerShift local-compatible pipeline; see deployment guide for remote data setup."
      max_concurrent_runs: 1
      tasks:
        - task_key: pipeline_entrypoint
          spark_python_task:
            python_file: ../src/ledgershift/pipelines/local.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml

    ledgershift_validation:
      name: ledgershift-${bundle.target}-validation
      description: "Fail-closed source-to-gold validation; configure matching paths before execution."
      max_concurrent_runs: 1
      tasks:
        - task_key: validation_entrypoint
          spark_python_task:
            python_file: ../src/ledgershift/validation/runner.py
            parameters:
              - --source
              - ${var.source_path}
              - --target
              - ${var.target_path}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml
