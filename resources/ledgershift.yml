resources:
  jobs:
    ledgershift_pipeline:
      name: ledgershift-${bundle.target}-pipeline
      description: "LedgerShift local-compatible pipeline entry point; validate workspace paths before production use."
      max_concurrent_runs: 1
      tasks:
        - task_key: pipeline_entrypoint
          spark_python_task:
            python_file: ../src/ledgershift/pipelines/local.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml
    ledgershift_validation:
      name: ledgershift-${bundle.target}-validation
      description: "Fail-closed JSONL reconciliation gate. Source and target paths must exist in the job environment."
      max_concurrent_runs: 1
      tasks:
        - task_key: validation_entrypoint
          spark_python_task:
            python_file: ../src/ledgershift/validation/runner.py
            parameters:
              - --source
              - ${workspace.file_path}/data/source/snapshot/orders.jsonl
              - --target
              - ${workspace.file_path}/data/gold/mart_daily_revenue
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../pyproject.toml
